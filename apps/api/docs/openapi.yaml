openapi: 3.1.0
info:
  title: CommerceOS API
  version: 0.1.0
  description: Foundation contract. Domain endpoints are added in their delivery phases.
servers:
  - url: /api/v1
paths:
  /system/echo:
    get:
      summary: Validate and echo a message
      parameters:
        - in: query
          name: message
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Echoed message
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [message]
                    properties:
                      message:
                        type: string
        '422':
          $ref: '#/components/responses/ValidationError'
  /health:
    servers:
      - url: /
    get:
      summary: MongoDB-backed health check
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status:
                        const: ok
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
            requestId:
              type: string
  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
