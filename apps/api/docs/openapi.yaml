          type: integer
          minimum: 0
        discount:
          type: integer
          minimum: 0
        shipping:
          type: integer
          minimum: 0
        tax:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
    OrderItem:
      type: object
      properties:
        productId:
          type: string
        variantId:
          type: string
        sku:
          type: string
        name:
          type: string
        variantLabel:
          type: string
        image:
          type: string
        unitPrice:
          type: integer
          minimum: 0
        quantity:
          type: integer
