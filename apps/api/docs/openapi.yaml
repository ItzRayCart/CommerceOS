openapi: 3.1.0
info:
  title: CommerceOS API
  version: 0.1.0
  description: Authentication, catalogue, cart, checkout and transactional orders contract. Payments
    use a demonstration provider; never send PAN or CVC.
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a customer and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          $ref: '#/components/responses/Session'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/Error'
  /auth/login:
    post:
      tags:
        - Auth
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Rotate the refresh cookie and issue a new access token
      security:
        - refreshCookie: []
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Revoke this refresh-token family
      security:
        - bearerAuth: []
          refreshCookie: []
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Request a password reset; always responds identically for known and unknown accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
        '429':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/reset-password:
    post:
      tags:
        - Auth
      summary: Consume a one-time reset token and revoke all refresh sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - password
              additionalProperties: false
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        '204':
          description: Password reset
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/me:
    get:
      tags:
        - Auth
      summary: Read the authenticated account
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/User'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /me:
    patch:
      tags:
        - Account
      summary: Update the authenticated profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                phone:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/User'
        default:
          $ref: '#/components/responses/Error'
  /me/change-password:
    post:
      tags:
        - Account
      summary: Change password and revoke refresh sessions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              additionalProperties: false
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '204':
          description: Password changed
        default:
          $ref: '#/components/responses/Error'
  /me/addresses:
    get:
      tags:
        - Account
      summary: List own addresses
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/AddressList'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
        - Account
      summary: Add an address (maximum ten)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '201':
          $ref: '#/components/responses/Address'
        default:
          $ref: '#/components/responses/Error'
  /me/addresses/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    patch:
      tags:
        - Account
      summary: Update an owned address
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressUpdate'
      responses:
        '200':
          $ref: '#/components/responses/Address'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
        - Account
      summary: Delete an owned address
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Address deleted
        default:
          $ref: '#/components/responses/Error'
  /admin/auth/check:
    get:
      tags:
        - Auth
      summary: Verify admin access
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Admin access granted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      allowed:
                        type: boolean
                        const: true
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /system/echo:
    get:
      summary: Validate and echo a message
      parameters:
        - in: query
          name: message
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Echoed message
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - message
                    properties:
                      message:
                        type: string
        '422':
          $ref: '#/components/responses/ValidationError'
  /health:
    servers:
      - url: /
    get:
      summary: MongoDB-backed health check
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - status
                    properties:
                      status:
                        const: ok
        '500':
          $ref: '#/components/responses/InternalError'
  /settings/public:
    get:
      tags:
        - Catalogue
      summary: Public store profile, currency, shipping, theme and feature flags
      responses:
        '200':
          $ref: '#/components/responses/Settings'
        default:
          $ref: '#/components/responses/Error'
  /categories:
    get:
      tags:
        - Catalogue
      summary: Active category tree and visible product counts
      responses:
        '200':
          $ref: '#/components/responses/Categories'
        default:
          $ref: '#/components/responses/Error'
  /categories/{slug}:
    get:
      tags:
        - Catalogue
      summary: Active category, children and breadcrumbs
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          $ref: '#/components/responses/Category'
        '404':
          $ref: '#/components/responses/Error'
  /products:
    get:
      tags:
        - Catalogue
      summary: Paginated, filtered product search
      description: Option filters use options[Color]=Graphite. sort=relevance requires q.
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: integer
            minimum: 0
        - name: maxPrice
          in: query
          schema:
            type: integer
            minimum: 0
        - name: inStock
          in: query
          schema:
            type: boolean
        - name: rating
          in: query
          schema:
            type: number
            minimum: 0
            maximum: 5
        - name: featured
          in: query
          schema:
            type: boolean
        - name: tags
          in: query
          schema:
            type: string
        - name: options[Color]
          in: query
          schema:
            type: string
        - name: includeFacets
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - relevance
              - -createdAt
              - price
              - -price
              - -soldCount
              - -ratingAverage
              - name
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Products'
        '422':
          $ref: '#/components/responses/ValidationError'
  /products/suggest:
    get:
      tags:
        - Catalogue
      summary: Up to six product and category search suggestions
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        '200':
          $ref: '#/components/responses/Suggestions'
        '422':
          $ref: '#/components/responses/ValidationError'
  /products/{slug}:
    get:
      tags:
        - Catalogue
      summary: Visible product with active variants, gallery and specifications
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          $ref: '#/components/responses/Product'
        '404':
          $ref: '#/components/responses/Error'
  /products/{slug}/related:
    get:
      tags:
        - Catalogue
      summary: Up to eight related visible products
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          $ref: '#/components/responses/Products'
        '404':
          $ref: '#/components/responses/Error'
  /wishlist:
    get:
      tags:
        - Wishlist
      summary: Paginated saved products
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Products'
        '401':
          $ref: '#/components/responses/Error'
  /wishlist/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    post:
      tags:
        - Wishlist
      summary: Save a visible product, idempotently
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Product saved
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      tags:
        - Wishlist
      summary: Remove a saved product
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Product removed
        '401':
          $ref: '#/components/responses/Error'
  /cart/price:
    post:
      tags:
        - Cart
      summary: Quote guest items against current catalogue prices and stock
      requestBody:
        $ref: '#/components/requestBodies/CartItems'
      responses:
        '200':
          $ref: '#/components/responses/Cart'
        '422':
          $ref: '#/components/responses/ValidationError'
  /cart:
    get:
      tags:
        - Cart
      summary: Read and reprice own cart
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Cart'
        '401':
          $ref: '#/components/responses/Error'
    delete:
      tags:
        - Cart
      summary: Empty own cart
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Cart cleared
  /cart/items:
    post:
      tags:
        - Cart
      summary: Add an item, enforcing quantity and stock
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/CartItem'
      responses:
        '201':
          $ref: '#/components/responses/Cart'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
  /cart/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    patch:
      tags:
        - Cart
      summary: Set item quantity
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - quantity
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 10
      responses:
        '200':
          $ref: '#/components/responses/Cart'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
        - Cart
      summary: Remove an item
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Item removed
        '404':
          $ref: '#/components/responses/Error'
  /cart/merge:
    post:
      tags:
        - Cart
      summary: Merge guest lines with own cart, capped by stock and ten units
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/CartItems'
      responses:
        '200':
          $ref: '#/components/responses/Cart'
        '422':
          $ref: '#/components/responses/ValidationError'
  /cart/discount:
    post:
      tags:
        - Cart
      summary: Apply one discount code
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Cart'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      tags:
        - Cart
      summary: Remove discount code
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Discount removed
  /checkout/quote:
    post:
      tags:
        - Checkout
      summary: Read a consistent quote from the authenticated server cart, address and chosen active
        shipping method
      description:
        No stock reservation or other side effects. Validates current stock, visibility and the
        saved discount. Prices and totals are computed from MongoDB.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutInput'
      responses:
        '200':
          description: Server quote
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CheckoutQuote'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /orders:
    post:
      tags:
        - Orders
      summary: Place an order atomically and return its immutable snapshots
      description:
        Same user and Idempotency-Key always return the existing order, including after cart
        clearing. A quoteFingerprint detects changes since review. Retry uncertain network/server
        failures with the same key and payload. Known compatibility fields price/prices/total/totals
        are ignored; all other unknown fields are rejected. PAN/CVC are rejected.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: ^[a-zA-Z0-9_-]{8,128}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: Created or idempotently replayed order
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Error'
        '402':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    get:
      tags:
        - Orders
      summary: Own orders, newest first
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Own orders and pagination metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /orders/{orderNumber}:
    get:
      tags:
        - Orders
      summary: Own order detail with snapshots, payment and timeline
      security:
        - bearerAuth: []
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /orders/{orderNumber}/cancel:
    post:
      tags:
        - Orders
      summary: Cancel an own pending order, atomically restore stock and release discount usage
      security:
        - bearerAuth: []
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Cancelled order
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /admin/orders/{id}/status:
    patch:
      tags:
        - Orders
      summary: Authorized order transition, including COD mark-paid
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - status
              properties:
                status:
                  $ref: '#/components/schemas/OrderStatus'
                note:
                  type: string
                  maxLength: 1000
                tracking:
                  type: object
                  additionalProperties: false
                  required:
                    - carrier
                    - number
                  properties:
                    carrier:
                      type: string
                      minLength: 1
                      maxLength: 100
                    number:
                      type: string
                      minLength: 1
                      maxLength: 100
                restock:
                  type: boolean
      responses:
        '200':
          description: Updated order; COD paidAt and history recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /admin/products:
    get:
      tags:
        - Admin
      summary: Search and filter products
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          required: false
          schema:
            default: 1
            type: integer
            minimum: 1
            maximum: 9007199254740991
        - in: query
          name: limit
          required: false
          schema:
            default: 20
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: q
          required: false
          schema:
            type: string
            maxLength: 100
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum:
              - draft
              - active
              - archived
        - in: query
          name: category
          required: false
          schema:
            type: string
            pattern: ^[a-f\d]{24}$
        - in: query
          name: stock
          required: false
          schema:
            type: string
            enum:
              - low
              - out
        - in: query
          name: sort
          required: false
          schema:
            default: -createdAt
            type: string
            enum:
              - name
              - -name
              - createdAt
              - -createdAt
              - minPrice
              - -minPrice
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminProduct'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required:
                  - data
                  - meta
        '400':
          description: Standard error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Standard error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Standard error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Standard error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Standard error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Standard error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Standard error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Standard error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Admin
      summary: Create product and stock movements
      security:
        - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AdminProduct'
                required:
                  - data
        '400':
          description: Standard error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Standard error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Standard error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Standard error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
