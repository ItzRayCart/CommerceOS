          name: limit
          required: false
          schema:
            default: 20
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: q
          required: false
          schema:
            type: string
            maxLength: 100
        - in: query
          name: status
          required: false
          schema:
            type: string
