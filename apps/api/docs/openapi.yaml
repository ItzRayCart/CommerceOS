openapi: 3.1.0
info:
  title: CommerceOS API
  version: 0.1.0
  description: Foundation and authentication/session contract.
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a customer and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201': { $ref: '#/components/responses/Session' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the refresh cookie and issue a new access token
      security: [{ refreshCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke this refresh-token family
      security: [{ bearerAuth: [], refreshCookie: [] }]
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset; always responds identically for known and unknown accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: Request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message: { type: string }
        '429': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Consume a one-time reset token and revoke all refresh sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              additionalProperties: false
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '204': { description: Password reset }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Read the authenticated account
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/User' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /me:
    patch:
      tags: [Account]
      summary: Update the authenticated profile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                firstName: { type: string }
                lastName: { type: string }
                phone: { type: string }
      responses:
        '200': { $ref: '#/components/responses/User' }
        default: { $ref: '#/components/responses/Error' }
  /me/change-password:
    post:
      tags: [Account]
      summary: Change password and revoke refresh sessions
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              additionalProperties: false
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '204': { description: Password changed }
        default: { $ref: '#/components/responses/Error' }
  /me/addresses:
    get:
      tags: [Account]
      summary: List own addresses
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/AddressList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Account]
      summary: Add an address (maximum ten)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '201': { $ref: '#/components/responses/Address' }
        default: { $ref: '#/components/responses/Error' }
  /me/addresses/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    patch:
      tags: [Account]
      summary: Update an owned address
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressUpdate' }
      responses:
        '200': { $ref: '#/components/responses/Address' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Account]
      summary: Delete an owned address
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Address deleted }
        default: { $ref: '#/components/responses/Error' }
  /admin/auth/check:
    get:
      tags: [Auth]
      summary: Verify admin access
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Admin access granted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      allowed: { type: boolean, const: true }
        '403': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /system/echo:
    get:
      summary: Validate and echo a message
      parameters:
        - in: query
          name: message
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Echoed message
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [message]
                    properties:
                      message:
                        type: string
        '422':
          $ref: '#/components/responses/ValidationError'
  /health:
    servers:
      - url: /
    get:
      summary: MongoDB-backed health check
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status:
                        const: ok
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    refreshCookie: { type: apiKey, in: cookie, name: refreshToken }
  schemas:
    RegisterInput:
      type: object
      required: [email, password, firstName, lastName]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        firstName: { type: string }
        lastName: { type: string }
        role: { description: Ignored; every public registration creates a customer }
    LoginInput:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password: { type: string }
    AddressInput:
      type: object
      required: [label, fullName, line1, city, region, postalCode, country, phone]
      additionalProperties: false
      properties:
        label: { type: string }
        fullName: { type: string }
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        region: { type: string }
        postalCode: { type: string }
        country: { type: string, minLength: 2, maxLength: 2 }
        phone: { type: string }
        isDefault: { type: boolean }
    AddressUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        label: { type: string }
        fullName: { type: string }
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        region: { type: string }
        postalCode: { type: string }
        country: { type: string, minLength: 2, maxLength: 2 }
        phone: { type: string }
        isDefault: { type: boolean }
    Address:
      type: object
      required: [id, label, fullName, line1, city, region, postalCode, country, phone, isDefault]
      properties:
        id: { type: string }
        label: { type: string }
        fullName: { type: string }
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        region: { type: string }
        postalCode: { type: string }
        country: { type: string }
        phone: { type: string }
        isDefault: { type: boolean }
    User:
      type: object
      required: [id, email, firstName, lastName, role, status]
      properties:
        id: { type: string }
        email: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string }
        role: { type: string, enum: [customer, admin] }
        status: { type: string, enum: [active, disabled] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
            requestId:
              type: string
  responses:
    Error:
      description: Request rejected
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    User:
      description: Authenticated account
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/User' }
    Address:
      description: Saved address
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Address' }
    AddressList:
      description: Saved addresses
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items: { $ref: '#/components/schemas/Address' }
    Session:
      description: Access token in response; refresh token in HttpOnly cookie
      headers:
        Set-Cookie:
          schema: { type: string }
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  accessToken: { type: string }
                  user: { $ref: '#/components/schemas/User' }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
