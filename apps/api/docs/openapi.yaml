components:
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-fA-F0-9]{24}$
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-fA-F0-9]{24}$
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 12
  requestBodies:
    CartItem:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CartItemInput'
    CartItems:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/CartItemInput'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken
  schemas:
    PaginationMeta:
      type: object
      required:
        - page
        - limit
        - total
        - totalPages
        - hasNext
        - hasPrev
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        hasNext:
          type: boolean
        hasPrev:
          type: boolean
    OrderStatus:
      type: string
      enum:
        - pending
        - paid
        - shipped
        - completed
        - cancelled
        - refunded
    CheckoutAddress:
      type: object
      additionalProperties: false
      required:
        - fullName
        - line1
        - city
        - region
        - postalCode
        - country
        - phone
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        line1:
          type: string
          minLength: 1
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        city:
          type: string
          minLength: 1
          maxLength: 100
        region:
          type: string
          minLength: 1
          maxLength: 100
        postalCode:
          type: string
          minLength: 1
          maxLength: 30
        country:
          type: string
          pattern: ^[a-zA-Z]{2}$
        phone:
          type: string
          pattern: ^\+?[1-9]\d{6,14}$
    CheckoutInput:
      type: object
      additionalProperties: false
      required:
        - shippingMethodCode
      oneOf:
        - required:
            - address
        - required:
            - addressId
      properties:
        address:
          $ref: '#/components/schemas/CheckoutAddress'
        addressId:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
        shippingMethodCode:
          type: string
          minLength: 1
          maxLength: 50
    OrderInput:
      type: object
      additionalProperties: false
      required:
        - shippingMethodCode
        - payment
      oneOf:
        - required:
            - address
        - required:
            - addressId
      properties:
        address:
          $ref: '#/components/schemas/CheckoutAddress'
        addressId:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
        shippingMethodCode:
          type: string
          minLength: 1
          maxLength: 50
        quoteFingerprint:
          type: string
          pattern: ^[a-f0-9]{64}$
        payment:
          type: object
          additionalProperties: false
          required:
            - method
          properties:
            method:
              type: string
              enum:
                - card_mock
                - cod
            token:
              type: string
              maxLength: 100
            last4:
              type: string
              pattern: ^\d{4}$
        prices:
          description: Ignored compatibility field for AC-CHK-05
        price:
          description: Ignored compatibility field for AC-CHK-05
        total:
          description: Ignored compatibility field for AC-CHK-05
        totals:
          description: Ignored compatibility field for AC-CHK-05
    OrderTotals:
      type: object
      required:
        - subtotal
        - discount
        - shipping
        - tax
        - total
