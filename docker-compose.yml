services:
  mongo:
    image: mongo:7
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        mongosh --host mongo --quiet --eval
        'try { rs.status() } catch (error) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}) }' &&
        until mongosh --host mongo --quiet --eval 'db.hello().isWritablePrimary' | grep -q true;
        do sleep 1; done
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/commerceos?replicaSet=rs0
      PORT: 4000
    ports:
      - '4000:4000'
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    volumes:
      - uploads:/app/apps/api/uploads

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - '4200:80'
    depends_on:
      - api

volumes:
  mongo-data:
  uploads:
